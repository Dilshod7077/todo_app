<div class="container">

  <h1 class="title">✨ Todo App</h1>

  <!-- INPUT -->
  <div class="task-input">

    <input
      class="search-input"
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
      placeholder="🔍 Поиск задачи..."
    >

    <input
      [(ngModel)]="newTask"
      placeholder="Добавить новую задачу..."
    >

    <button class="add-btn" (click)="addTask()">
      Добавить
    </button>

  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button (click)="filter.set('all')">Все</button>
    <button (click)="filter.set('active')">Активные</button>
    <button (click)="filter.set('done')">Выполненные</button>
  </div>

  <!-- LIST -->
  <div
    class="task-list"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
  >

    <div
      class="task-card"
      *ngFor="let task of filteredTasks(); trackBy: trackById"
      cdkDrag
    >

      <input
        type="checkbox"
        [checked]="task.done"
        (change)="toggleDone(task)"
      >

      <span
        *ngIf="!task.isEdit"
        class="task-text"
        [class.done]="task.done"
      >
        {{ task.text }}
      </span>

      <input
        *ngIf="task.isEdit"
        [(ngModel)]="task.text"
        class="edit-input"
      >

      <button
        class="icon-btn"
        *ngIf="!task.isEdit"
        (click)="editTask(task)"
      >
        ✏️
      </button>

      <button
        class="icon-btn"
        *ngIf="task.isEdit"
        (click)="saveTask(task)"
      >
        💾
      </button>

      <button
        class="icon-btn"
        (click)="deleteTask(task.id)"
      >
        🗑️
      </button>

    </div>

  </div>

  <!-- STATS -->
  <div class="stats">

    <div class="stats-item">
      <span class="stats-number">{{ totalCount() }}</span>
      <span class="stats-label">Всего</span>
    </div>

    <div class="stats-item">
      <span class="stats-number">{{ activeCount() }}</span>
      <span class="stats-label">Активных</span>
    </div>

    <div class="stats-item">
      <span class="stats-number">{{ doneCount() }}</span>
      <span class="stats-label">Выполненных</span>
    </div>

  </div>

</div>
